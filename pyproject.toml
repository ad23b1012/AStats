[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astats"
version = "0.1.0"
description = "AStats: An agentic-AI approach to applied statistical practitioner workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AStats Contributors" },
]
keywords = ["statistics", "agentic-ai", "data-science", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core Scientific
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",

    # LLM Providers (FREE only)
    "google-genai>=1.0",
    "groq>=0.4",
    "litellm>=1.30",

    # CLI & UX
    "rich>=13.0",
    "click>=8.1",
    "prompt-toolkit>=3.0",

    # Data Formats
    "openpyxl>=3.1",
    "pyarrow>=14.0",

    # Configuration
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tomli>=2.0; python_version < '3.11'",

    # Utilities
    "jinja2>=3.1",
    "tenacity>=8.2",
    "chardet>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
spss = [
    "pyreadstat>=1.2",
]
all = [
    "astats[dev,spss]",
]

[project.scripts]
astats = "astats.cli.main:cli"

[project.urls]
Homepage = "https://github.com/m2b3/AStats"
Repository = "https://github.com/m2b3/AStats"
Issues = "https://github.com/m2b3/AStats/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
